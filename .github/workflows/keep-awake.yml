# .github/workflows/keep-awake.yml
# Opens the apply site in a real headless browser every 4 hours, so Streamlit sees a live
# visitor session (websocket) and does not put the app to sleep. If the app is already
# asleep, the script clicks the wake-up button.

name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the app like a real visitor
        run: |
          cat > visit.py << 'PYEOF'
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          URL = "https://chemistry-urp-apply.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="domcontentloaded", timeout=90000)
              woke = False
              try:
                  btn = page.get_by_role("button", name="Yes, get this app back up!")
                  btn.wait_for(timeout=20000)
                  btn.click()
                  woke = True
                  print("App was asleep: wake-up button clicked")
              except PWTimeout:
                  print("App was already awake")
              # Stay on the page so a live session is registered (longer if it was just woken up)
              page.wait_for_timeout(120000 if woke else 40000)
              print("Page title:", page.title())
              browser.close()
          PYEOF
          python visit.py
